opencollection: 1.0.0

info:
  name: WaitLess
  version: 1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: SERVER_URL
      value: http://127.0.0.1:5000
    - name: token
      value: 
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.body?.data;
        if (jsonData?.jwtToken) bru.setCollectionVar("token", jsonData.jwtToken);
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
