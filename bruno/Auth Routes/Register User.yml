info:
  name: Register User
  type: http
  seq: 3

http:
  method: POST
  url: "{{AUTH_URL}}/register"
  body:
    type: json
    data: |-
      {
        "name": "User 1",
        "email": "user@waitless.com",
        "password": "pass123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
