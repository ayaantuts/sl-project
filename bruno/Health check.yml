info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER_URL}}"
  auth: inherit

runtime:
  variables:
    - name: SERVER_URL
      value: http://127.0.0.1:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
